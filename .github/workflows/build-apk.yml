name: Build Vynox Play APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Comprobar archivos
        run: |
          test -f package.json
          test -d android
          echo "Archivos encontrados."

      - name: Instalar dependencias
        run: |
          npm cache clean --force
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Preparar proyecto Android
        run: npm run cap:build

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Corregir recursos duplicados del icono
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("android/app/src/main/res/values")
          color_file = base / "colors.xml"
          duplicate_file = base / "ic_launcher_background.xml"

          if color_file.exists() and duplicate_file.exists():
              color_text = color_file.read_text()
              duplicate_text = duplicate_file.read_text()

              pattern = (
                  r'<color\s+name=["\']ic_launcher_background["\']'
                  r'[^>]*>.*?</color>'
              )

              color_match = re.search(
                  pattern, color_text, flags=re.DOTALL
              )
              duplicate_match = re.search(
                  pattern, duplicate_text, flags=re.DOTALL
              )

              if color_match and duplicate_match:
                  color_file.write_text(
                      re.sub(
                          pattern,
                          "",
                          color_text,
                          count=1,
                          flags=re.DOTALL
                      )
                  )
                  print(
                      "Se eliminó la definición duplicada "
                      "de colors.xml."
                  )
              else:
                  raise SystemExit(
                      "No se pudo identificar con seguridad "
                      "el recurso duplicado. Se detiene la compilación."
                  )
          else:
              print(
                  "No se encontraron ambos archivos; "
                  "no se modificaron recursos."
              )
          PY

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vynox-Play-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
