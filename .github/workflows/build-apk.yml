name: Build Vynox Play APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar archivos del proyecto
        run: |
          test -f package.json || (echo "ERROR: Falta package.json en la raíz" && exit 1)
          test -d android || (echo "ERROR: Falta la carpeta android" && exit 1)
          echo "Archivos principales encontrados."

      - name: Instalar dependencias
        run: npm install

      - name: Preparar proyecto Android
        run: npm run cap:build

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vynox-Play-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
