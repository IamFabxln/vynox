
name: Build Vynox Play APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Vynox Play APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Comprobar archivos
        run: |
          test -f package.json
          test -f capacitor.config.ts
          test -d android
          echo "Archivos del proyecto encontrados."

      - name: Instalar dependencias
        run: |
          npm cache clean --force
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Construir web y sincronizar Android
        run: npm run cap:build

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Compilar APK limpio
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-build-cache clean assembleDebug

      - name: Verificar estructura y firma del APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          echo "Tamaño del APK:"
          ls -lh "$APK"

          echo "Verificando estructura ZIP..."
          unzip -t "$APK"

          echo "Buscando herramientas Android..."
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -type f -name aapt | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          test -n "$AAPT"

          echo "Verificando firma..."
          "$APKSIGNER" verify --verbose "$APK"

          echo "Verificando paquete..."
          "$AAPT" dump badging "$APK" > /tmp/vynox-badging.txt
          cat /tmp/vynox-badging.txt

          grep -q "package: name='com.stellarxly.vynoxplay'" \
            /tmp/vynox-badging.txt

          echo "APK válido estructuralmente y con firma verificada."

      - name: Guardar APK verificado
        uses: actions/upload-artifact@v4
        with:
          name: Vynox-Play-APK-Verificado
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
