<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vynox Play — Iniciar Sesión y Registro</title>
  <meta name="description" content="Accede a Vynox Play, tu plataforma de música con diseño refinado, streaming oficial de Audius y sonido envolvente." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/vynox.css" />
</head>
<body class="bg-[#11100F] text-[#FAF7F2] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Warm Ambient Glowing Accents (Earthy Amber & Terracotta) -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-[#E07A5F]/10 rounded-full blur-3xl pointer-events-none"></div>

  <main class="w-full max-w-md relative z-10">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <a href="/html/dash.html" class="inline-block transform hover:scale-105 transition-transform duration-200">
        <img src="/assets/vynox-logo.svg" alt="Vynox Play" class="h-11 mx-auto drop-shadow-[0_0_20px_rgba(245,158,11,0.25)]" />
      </a>
      <p class="text-xs text-[#BDB5AA] mt-2.5 font-medium tracking-wide">Plataforma Web de Música · Audius Network</p>
    </div>

    <!-- Auth Container (ChatGPT Dark Surface) -->
    <div class="bg-[#181614] border border-[#2D2823] rounded-2xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl relative">
      
      <!-- Segmented Tabs -->
      <div class="flex items-center gap-1 p-1 bg-[#121110] rounded-xl mb-6 border border-[#2B2621]">
        <button 
          id="tab-login" 
          type="button" 
          class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-200 bg-[#28231E] text-amber-400 border border-amber-500/40 shadow-sm"
        >
          Iniciar Sesión
        </button>
        <button 
          id="tab-register" 
          type="button" 
          class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-200 text-[#8F867C] hover:text-[#FAF7F2] border border-transparent"
        >
          Crear Cuenta
        </button>
      </div>

      <!-- Error Alert Message -->
      <div id="error-alert" class="hidden mb-5 p-3 rounded-xl bg-[#2E1815] border border-rose-500/40 text-rose-200 text-xs flex items-center gap-2">
        <svg width="16" height="16" class="w-4 h-4 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <p id="error-text" class="leading-tight font-medium"></p>
      </div>

      <!-- Form: Iniciar Sesión -->
      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-semibold text-[#D5CBC0] mb-1.5 uppercase tracking-wider">
            Correo Electrónico
          </label>
          <div class="relative">
            <input 
              id="login-email" 
              name="email" 
              type="email" 
              required 
              placeholder="tu@correo.com" 
              class="w-full px-4 py-2.5 rounded-xl bg-[#201D1A] border border-[#332D27] text-[#FAF7F2] placeholder-[#7D756C] text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
            />
          </div>
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-[#D5CBC0] mb-1.5 uppercase tracking-wider">
            Contraseña
          </label>
          <input 
            id="login-password" 
            name="password" 
            type="password" 
            required 
            placeholder="••••••••" 
            class="w-full px-4 py-2.5 rounded-xl bg-[#201D1A] border border-[#332D27] text-[#FAF7F2] placeholder-[#7D756C] text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
          />
        </div>

        <button 
          id="btn-submit-login" 
          type="submit" 
          class="w-full py-3 px-4 rounded-xl font-bold text-sm text-[#141210] bg-gradient-to-r from-amber-400 via-amber-500 to-[#E07A5F] hover:from-amber-300 hover:to-amber-400 active:scale-[0.99] transition-all duration-200 shadow-lg shadow-amber-500/20 flex items-center justify-center cursor-pointer"
        >
          Iniciar Sesión
        </button>
      </form>

      <!-- Form: Crear Cuenta -->
      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label for="reg-name" class="block text-xs font-semibold text-[#D5CBC0] mb-1.5 uppercase tracking-wider">
            Nombre Completo
          </label>
          <input 
            id="reg-name" 
            name="name" 
            type="text" 
            required 
            placeholder="Alex Rivera" 
            class="w-full px-4 py-2.5 rounded-xl bg-[#201D1A] border border-[#332D27] text-[#FAF7F2] placeholder-[#7D756C] text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
          />
        </div>

        <div>
          <label for="reg-email" class="block text-xs font-semibold text-[#D5CBC0] mb-1.5 uppercase tracking-wider">
            Correo Electrónico
          </label>
          <input 
            id="reg-email" 
            name="email" 
            type="email" 
            required 
            placeholder="alex@ejemplo.com" 
            class="w-full px-4 py-2.5 rounded-xl bg-[#201D1A] border border-[#332D27] text-[#FAF7F2] placeholder-[#7D756C] text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
          />
        </div>

        <div>
          <label for="reg-password" class="block text-xs font-semibold text-[#D5CBC0] mb-1.5 uppercase tracking-wider">
            Contraseña (mínimo 6 caracteres)
          </label>
          <input 
            id="reg-password" 
            name="password" 
            type="password" 
            required 
            placeholder="••••••••" 
            class="w-full px-4 py-2.5 rounded-xl bg-[#201D1A] border border-[#332D27] text-[#FAF7F2] placeholder-[#7D756C] text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
          />
        </div>

        <div>
          <label for="reg-confirm-password" class="block text-xs font-semibold text-[#D5CBC0] mb-1.5 uppercase tracking-wider">
            Confirmar Contraseña
          </label>
          <input 
            id="reg-confirm-password" 
            name="confirmPassword" 
            type="password" 
            required 
            placeholder="••••••••" 
            class="w-full px-4 py-2.5 rounded-xl bg-[#201D1A] border border-[#332D27] text-[#FAF7F2] placeholder-[#7D756C] text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
          />
        </div>

        <button 
          id="btn-submit-register" 
          type="submit" 
          class="w-full py-3 px-4 rounded-xl font-bold text-sm text-[#141210] bg-gradient-to-r from-amber-400 via-amber-500 to-[#E07A5F] hover:from-amber-300 hover:to-amber-400 active:scale-[0.99] transition-all duration-200 shadow-lg shadow-amber-500/20 flex items-center justify-center cursor-pointer"
        >
          Crear Cuenta
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="/html/dash.html" class="text-xs text-[#BDB5AA] hover:text-amber-400 transition-colors">
          Explorar catálogo como invitado &rarr;
        </a>
      </div>
    </div>
  </main>

  <script type="module" src="/src/login.ts"></script>
</body>
</html>
