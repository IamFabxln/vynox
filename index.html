<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Vynox Play</title>
  <meta name="description" content="Vynox Play: plataforma de música de última generación con diseño refinado, reproductor avanzado y catálogo oficial de Audius." />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #11100F;
      color: #FAF7F2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .splash-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(217, 119, 6, 0.2);
      border-top-color: #d97706;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #FAF7F2;
    }
  </style>
  <script>
    (function() {
      var token = null;
      try {
        token = localStorage.getItem('vynox_token') || sessionStorage.getItem('vynox_token');
      } catch (e) {}

      var target = token ? '/html/dash.html' : '/html/login.html';
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="splash-container">
    <div class="spinner"></div>
    <div class="brand-title">Vynox Play</div>
  </div>
</body>
</html>
